    <circle cx="140" cy="140" r="94" fill="#07111f" opacity="0.92"/>
    <path d="M122 90c-34 11-58 42-58 79 0 46 37 84 84 84 29 0 54-14 69-36" fill="none" stroke="#f8fafc" stroke-width="24" stroke-linecap="round"/>
