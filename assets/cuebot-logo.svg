<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">CueBot Logo</title>
  <desc id="desc">CueBot wordmark with a rounded audio-play icon.</desc>
  <defs>
    <linearGradient id="mark" x1="40" y1="40" x2="320" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1fd1a5"/>
      <stop offset="0.52" stop-color="#3273f6"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="48" fill="#0b1020"/>
  <g transform="translate(50 40)">
