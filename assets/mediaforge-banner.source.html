<!doctype html>
<!--
  MediaForge README banner — true-font source (1280x320).
  Requires internet access for the Google Fonts @import (Space Grotesk /
  Inter) — open this file in a normal browser, not the sandbox, then
  screenshot/export the #banner element at 1280x320 for a pixel-perfect
  result. The delivered PNG uses local substitute fonts (Poppins / Liberation
  Sans) since the render sandbox has no font-CDN access; this file is the
  fix for that when you have a moment.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>MediaForge banner</title>
<meta name="hz:canvas-width" content="1280">
<meta name="hz:canvas-height" content="320">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { background: #1A1D20; }

  #banner {
    position: relative;
    width: 1280px;
    height: 320px;
    background: #1A1D20;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
  }

  .waveform rect { fill: #4FB89F; fill-opacity: 0.06; }
  .waveform polyline { fill: none; stroke: #4FB89F; stroke-opacity: 0.10; stroke-width: 1; }

  .content {
    position: absolute;
    left: 72px;
    top: 0;
    height: 320px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 18px;
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 80px;
    line-height: 1;
    color: #FAFAF7;
    letter-spacing: -0.01em;
  }

  .rule {
    width: 84px;
    height: 4px;
    background: #0F6E56;
  }

  p {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 23px;
    color: #8A8F98;
    margin-top: 4px;
  }

  .tag {
    position: absolute;
    right: 28px;
    bottom: 24px;
    font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
    font-size: 13px;
    letter-spacing: 0.15em;
    color: #8A8F98;
    opacity: 0.6;
  }
</style>
</head>
